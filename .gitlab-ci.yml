stages:
  - build
  - test

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

default:
  image: eclipse-temurin:17-jdk
  before_script:
    - chmod +x ./gradlew
  cache:
    key: gradle-$CI_COMMIT_REF_SLUG
    paths:
      - .gradle/caches
      - .gradle/wrapper

build:
  stage: build
  script:
    - ./gradlew installDist
  artifacts:
    paths:
      - build/install/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH

test:
  stage: test
  script:
    - ./gradlew test
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/**/TEST-*.xml
  rules:
    - if: $CI_COMMIT_BRANCH
